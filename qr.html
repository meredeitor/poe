<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/styles.css"><title>QR · Caborca POE</title><style>body{display:grid;place-items:center;padding:30px}.qr-card{background:#fff;border:1px solid #dce5eb;border-radius:20px;padding:32px;text-align:center;width:min(430px,100%)}#qr{display:grid;place-items:center;margin:22px}#qr canvas{max-width:100%;height:auto}.qr-card h1{margin:10px}.qr-card .button{margin:5px}@media print{.button{display:none}.qr-card{border:0}}</style></head><body><main class="qr-card"><div class="brand" style="justify-content:center"><span class="brand-mark">C</span><span>Caborca <b>POE</b></span></div><p class="eyebrow">PROCEDIMIENTO OPERACIONAL</p><h1 id="code"></h1><div id="qr"></div><p>ESCANEA PARA CONSULTAR EL PROCEDIMIENTO OPERACIONAL</p><button id="download" class="button">Descargar PNG</button><button onclick="print()" class="button ghost">Imprimir</button></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const id=new URLSearchParams(location.search).get('id')||'';code.textContent=id;const url=new URL('poe.html',location.href);url.search='?id='+encodeURIComponent(id);new QRCode(qr,{text:url.href,width:280,height:280,colorDark:'#102a43'});download.onclick=()=>{const source=qr.querySelector('canvas');const a=document.createElement('a');a.download=id+'-QR.png';a.href=source.toDataURL('image/png');a.click()}</script></body></html>
