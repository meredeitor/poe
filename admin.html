<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/admin.css"><title>Administración · Caborca POE</title></head><body><div class="admin-shell"><aside><a class="brand inverse" href="admin.html"><span class="brand-mark">C</span><span>Caborca <b>POE</b></span></a><nav><button class="nav active" data-view="dashboard">▦ Resumen</button><button class="nav" data-view="poes">▤ Procedimientos</button><button class="nav" data-view="catalogs">⌘ Catálogos</button></nav><button id="logout" class="nav bottom">Salir</button></aside><main class="admin-main"><header class="admin-header"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1 id="page-title">Resumen operativo</h1></div><button id="new-poe" class="button">+ Nuevo POE</button></header><p id="notice" class="message" role="status"></p><section id="dashboard-view"><div id="metrics" class="metrics"></div><div class="panel"><div class="section-title"><h2>Procedimientos recientes</h2><button class="link" data-go="poes">Ver todos</button></div><div id="recent"></div></div></section><section id="poes-view" hidden><div class="toolbar"><input id="admin-search" placeholder="Buscar por código o nombre"><select id="status-filter"><option value="">Todos los estados</option><option>Vigente</option><option>Borrador</option><option>En revisión</option><option>Obsoleto</option></select></div><div class="panel table-wrap"><table><thead><tr><th>Código</th><th>POE</th><th>Área</th><th>Revisión</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="poe-table"></tbody></table></div></section><section id="catalogs-view" hidden><div class="catalog-grid"><div class="panel"><h2>Nuevo registro</h2><form id="catalog-form" class="stack"><label>Catálogo<select id="catalog-type"><option value="areas">Áreas</option><option value="procesos">Procesos</option><option value="maquinas">Máquinas</option><option value="puestos">Puestos</option></select></label><label>Nombre<input id="catalog-name" required></label><label>Descripción<textarea id="catalog-description"></textarea></label><button class="button">Guardar</button></form></div><div class="panel"><h2>Catálogos</h2><div id="catalog-list"></div></div></div></section></main></div><dialog id="poe-dialog"><form id="poe-form" method="dialog"><div class="dialog-head"><div><p class="eyebrow">EDITOR</p><h2 id="dialog-title">Nuevo POE</h2></div><button type="button" class="icon-button" data-close aria-label="Cerrar">×</button></div><input id="poe-id" type="hidden"><div class="form-grid"><label>Código<input id="codigo" placeholder="POE-CORTE-001" required></label><label>Nombre<input id="nombre" required></label><label>Área<input id="area" required></label><label>Proceso<input id="proceso"></label><label>Máquina<input id="maquina"></label><label>Puesto<input id="puesto"></label><label class="full">Objetivo<textarea id="objetivo"></textarea></label><label class="full">Alcance<textarea id="alcance"></textarea></label><label>Elaboró<input id="elaboro" required></label><label>Revisó<input id="reviso" required></label><label>Aprobó<input id="aprobo" required></label><label>Vigencia<input id="vigencia" type="date" required></label></div><div class="steps-head"><h3>Instrucciones</h3><button id="add-step" type="button" class="button secondary">+ Agregar paso</button></div><div id="steps"></div><div class="dialog-actions"><button type="button" class="button ghost" data-close>Cancelar</button><button class="button" value="save">Guardar borrador</button></div></form></dialog><script type="module" src="js/admin.js"></script></body></html>
